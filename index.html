<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ستايل | متجر ملابس</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container nav">
      <a href="#" class="logo">ستايل</a>
      <nav>
        <a href="#products">المنتجات</a>
        <a href="#contact">تواصل معنا</a>
      </nav>
      <button id="cartBtn" class="cart-btn">🛒 <span id="cartCount">0</span></button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h1>ملابس بسيطة.. وستايل مميز</h1>
      <p>تشكيلة جديدة بأسعار مناسبة وجودة عالية</p>
      <a href="#products" class="btn">تسوق الآن</a>
    </div>
  </section>

  <section id="products" class="container section">
    <h2>منتجاتنا</h2>
    <div class="filters">
      <button class="filter active" data-cat="all">الكل</button>
      <button class="filter" data-cat="tshirt">تيشيرتات</button>
      <button class="filter" data-cat="pants">بناطيل</button>
      <button class="filter" data-cat="jacket">جاكتات</button>
    </div>
    <div id="productGrid" class="grid"></div>
  </section>

  <footer id="contact" class="footer">
    <p>للتواصل: 01000000000 | القاهرة، مصر</p>
    <p>© 2026 ستايل - جميع الحقوق محفوظة</p>
  </footer>

  <!-- السلة -->
  <div id="overlay" class="overlay"></div>
  <aside id="cart" class="cart">
    <div class="cart-head">
      <h3>سلة المشتريات</h3>
      <button id="closeCart">✕</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-foot">
      <p>الإجمالي: <strong id="cartTotal">0</strong> جنيه</p>
      <button id="checkout" class="btn full">اطلب عبر واتساب</button>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
